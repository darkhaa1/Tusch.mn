name: CI (dev)

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tusch_test?schema=public
      NODE_ENV: test
      JWT_SECRET: ci_dummy_secret_change_me
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tusch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate (api)
        working-directory: apps/api
        run: pnpm prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build API
        run: pnpm --filter api build

      - name: Prisma migrate deploy
        working-directory: apps/api
        run: pnpm prisma migrate deploy

      - name: API E2E tests
        working-directory: apps/api
        run: pnpm test:e2e --runInBand

      - name: Build web
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3310/api/v1
          NEXTAUTH_SECRET: ci-nextauth-secret-change-me-min-32-chars
          NEXTAUTH_URL: http://localhost:3000

      - name: Start API (background)
        working-directory: apps/api
        run: pnpm start &
        env:
          PORT: 3310
          CORS_ORIGIN: http://localhost:3000

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install chromium --with-deps

      - name: Web E2E tests (Playwright)
        working-directory: apps/web
        run: pnpm test:e2e
        env:
          CI: true
          TEST_BASE_URL: http://localhost:3000
          TEST_API_URL: http://localhost:3310/api/v1
          NEXT_PUBLIC_API_URL: http://localhost:3310/api/v1
          NEXTAUTH_SECRET: ci-nextauth-secret-change-me-min-32-chars
          NEXTAUTH_URL: http://localhost:3000
          PORT: 3000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
